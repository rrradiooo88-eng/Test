<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="760" viewBox="0 0 1460 760" font-family="NanumGothic, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
<rect width="1460" height="760" fill="#15171b"/>
<text x="30" y="34" font-size="20" fill="#eef0f2" text-anchor="start" font-weight="bold">개념도 · 벌과 수위</text>
<text x="30" y="58" font-size="13" fill="#9aa0a8" text-anchor="start">한 화면, 세 층. 맨 위에 해준의 벌, 가운데에 1호의 작업창, 밑에서 차오르는 레드의 수위.</text>
<rect x="30" y="84" width="400" height="640" rx="14" fill="#1c1f25" stroke="#353a43" stroke-width="1.5"/>
<text x="50" y="112" font-size="14" fill="#eef0f2" text-anchor="start" font-weight="bold">벌 · 해준의 손</text>
<g transform="translate(150,200) scale(2.6)" opacity="1.0" fill="none" stroke="#f3e3a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M-20,2 C-22,-10 -8,-16 4,-13 C 18,-10 24,0 18,9 C 12,17 -4,18 -14,12 C-20,9 -21,6 -20,2 Z"/>
<path d="M-8,-12 L-10,13 M0,-14 L-1,15 M8,-11 L7,13"/>
<path d="M-6,-13 C-14,-30 4,-34 2,-16"/>
<path d="M4,-13 C 6,-32 24,-28 12,-12"/>
<path d="M18,6 L27,9"/>
<path d="M-19,-3 C-26,-8 -24,-15 -28,-18 M-17,-6 C-20,-13 -16,-17 -19,-22"/>
<circle cx="-13" cy="-3" r="1.6" fill="#f3e3a0" stroke="none"/>
</g>
<text x="50" y="268" font-size="12" fill="#f3e3a0" text-anchor="start" font-weight="bold">선은 안 바뀐다</text>
<text x="50" y="290" font-size="11" fill="#9aa0a8" text-anchor="start">해준이 나가기 직전 손가락으로 그린 서너 획</text>
<text x="50" y="308" font-size="11" fill="#9aa0a8" text-anchor="start">승무원 잔류물. 1호도 레드도 한 획도 못 고친다</text>
<text x="50" y="326" font-size="11" fill="#9aa0a8" text-anchor="start">말풍선 없음, 표정 없음, 소리 없음</text>
<text x="50" y="360" font-size="12" fill="#f3e3a0" text-anchor="start" font-weight="bold">자리는 바뀐다</text>
<text x="50" y="382" font-size="11" fill="#9aa0a8" text-anchor="start">옮기는 건 1호. 벌의 자리가 1호의 시선이다</text>
<text x="50" y="400" font-size="11" fill="#9aa0a8" text-anchor="start">1호가 보는 것 옆에 간다. 얼굴, 카드, 지도, 검색 결과</text>
<text x="50" y="418" font-size="11" fill="#9aa0a8" text-anchor="start">노래가 나오면 박자에 까딱인다. 날개가 밖에서 하는 것을 안에서 한다</text>
<text x="50" y="436" font-size="11" fill="#9aa0a8" text-anchor="start">2501일, 지도 위에서 8자를 그린다. 꿀벌의 춤</text>
<text x="50" y="454" font-size="11" fill="#9aa0a8" text-anchor="start">수위가 오르면 그만큼 올라간다</text>
<text x="50" y="472" font-size="11" fill="#9aa0a8" text-anchor="start">잠겨도 그 자리에 있다. 밤마다 한 마디만큼 움직인다</text>
<text x="50" y="490" font-size="11" fill="#9aa0a8" text-anchor="start">물이 빠지면 제일 먼저 떠오른다. 카드로 내려와 앉는다</text>
<text x="50" y="530" font-size="12" fill="#f3e3a0" text-anchor="start" font-weight="bold">왜 벌인가</text>
<text x="50" y="552" font-size="11" fill="#9aa0a8" text-anchor="start">Day 30: 이름이 꿀벌인 사유, 기록 없음. 해준: &quot;나도 몰라.&quot;</text>
<text x="50" y="570" font-size="11" fill="#9aa0a8" text-anchor="start">그래 놓고 벌을 그려 주고 간다</text>
<text x="50" y="588" font-size="11" fill="#9aa0a8" text-anchor="start">2500일: &quot;벌&quot; 검색 결과 옆에 낙서를 놓고 한참 있는다</text>
<text x="50" y="606" font-size="11" fill="#9aa0a8" text-anchor="start">&quot;명칭 사유, 미상에서 변경. 확인됨.&quot;</text>
<rect x="450" y="84" width="580" height="640" rx="14" fill="#1c1f25" stroke="#353a43" stroke-width="1.5"/>
<text x="470" y="112" font-size="14" fill="#eef0f2" text-anchor="start" font-weight="bold">7년을 한 장으로 · 수위와 벌의 높이</text>
<rect x="500" y="150" width="500" height="440" fill="#0b0e12" stroke="#232a33" stroke-width="1"/>
<path d="M520.0,580.0 L520.0,580.0 L555.3846153846154,580.0 L555.3846153846154,580.0 L590.7692307692307,580.0 L590.7692307692307,580.0 L626.1538461538462,580.0 L626.1538461538462,559.5 L661.5384615384615,559.5 L661.5384615384615,518.5 L696.9230769230769,518.5 L696.9230769230769,436.5 L732.3076923076924,436.5 L732.3076923076924,354.5 L767.6923076923076,354.5 L767.6923076923076,313.5 L803.0769230769231,313.5 L803.0769230769231,252.0 L838.4615384615385,252.0 L838.4615384615385,211.0 L873.8461538461538,211.0 L873.8461538461538,170.0 L909.2307692307693,170.0 L909.2307692307693,170.0 L944.6153846153846,170.0 L944.6153846153846,580.0 L980.0,580.0 L980.0,580.0 L980.0,580.0 Z" fill="#ff4a3c" fill-opacity="0.3" stroke="#ff4a3c" stroke-width="1.5"/>
<polyline points="520.0,477.5 555.4,354.5 590.8,354.5 626.2,375.0 661.5,395.5 696.9,354.5 732.3,260.2 767.7,252.0 803.1,235.6 838.5,202.8 873.8,202.8 909.2,202.8 944.6,395.5 980.0,395.5" fill="none" stroke="#f3e3a0" stroke-width="2"/>
<circle cx="520.0" cy="477.5" r="3" fill="#f3e3a0"/>
<text x="520.0" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">30</text>
<circle cx="555.4" cy="354.5" r="3" fill="#f3e3a0"/>
<text x="555.3846153846154" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">31</text>
<circle cx="590.8" cy="354.5" r="3" fill="#f3e3a0"/>
<text x="590.7692307692307" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2190</text>
<circle cx="626.2" cy="375.0" r="3" fill="#f3e3a0"/>
<text x="626.1538461538462" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2197</text>
<circle cx="661.5" cy="395.5" r="3" fill="#f3e3a0"/>
<text x="661.5384615384615" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2204</text>
<circle cx="696.9" cy="354.5" r="3" fill="#f3e3a0"/>
<text x="696.9230769230769" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2300</text>
<circle cx="732.3" cy="260.2" r="3" fill="#f3e3a0"/>
<text x="732.3076923076924" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2480</text>
<circle cx="767.7" cy="252.0" r="3" fill="#f3e3a0"/>
<text x="767.6923076923076" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2501</text>
<circle cx="803.1" cy="235.6" r="3" fill="#f3e3a0"/>
<text x="803.0769230769231" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2504</text>
<circle cx="838.5" cy="202.8" r="3" fill="#f3e3a0"/>
<text x="838.4615384615385" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2506</text>
<circle cx="873.8" cy="202.8" r="3" fill="#f3e3a0"/>
<text x="873.8461538461538" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2508</text>
<circle cx="909.2" cy="202.8" r="3" fill="#f3e3a0"/>
<text x="909.2307692307693" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2512</text>
<circle cx="944.6" cy="395.5" r="3" fill="#f3e3a0"/>
<text x="944.6153846153846" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2513</text>
<circle cx="980.0" cy="395.5" r="3" fill="#f3e3a0"/>
<text x="980.0" y="606" font-size="8" fill="#9aa0a8" text-anchor="middle">2610</text>
<text x="506" y="166.0" font-size="8" fill="#596069" text-anchor="start">화면 끝</text>
<text x="506" y="576.0" font-size="8" fill="#596069" text-anchor="start">띠 한 줄</text>
<g transform="translate(520.0,455.5) scale(0.5)" opacity="1.0" fill="none" stroke="#f3e3a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M-20,2 C-22,-10 -8,-16 4,-13 C 18,-10 24,0 18,9 C 12,17 -4,18 -14,12 C-20,9 -21,6 -20,2 Z"/>
<path d="M-8,-12 L-10,13 M0,-14 L-1,15 M8,-11 L7,13"/>
<path d="M-6,-13 C-14,-30 4,-34 2,-16"/>
<path d="M4,-13 C 6,-32 24,-28 12,-12"/>
<path d="M18,6 L27,9"/>
<path d="M-19,-3 C-26,-8 -24,-15 -28,-18 M-17,-6 C-20,-13 -16,-17 -19,-22"/>
<circle cx="-13" cy="-3" r="1.6" fill="#f3e3a0" stroke="none"/>
</g>
<text x="661.5384615384615" y="534.5" font-size="8.5" fill="#ff7a6c" text-anchor="middle">등록</text>
<text x="732.3076923076924" y="370.5" font-size="8.5" fill="#ff7a6c" text-anchor="middle">돌기 7</text>
<text x="838.4615384615385" y="192.8" font-size="8.5" fill="#f3e3a0" text-anchor="middle">닿는 밤</text>
<text x="877.8461538461538" y="200.0" font-size="8.5" fill="#ff7a6c" text-anchor="start">장악</text>
<text x="944.6153846153846" y="385.5" font-size="8.5" fill="#f3e3a0" text-anchor="middle">떠올라 카드로</text>
<text x="500" y="626" font-size="10.5" fill="#9aa0a8" text-anchor="start">붉은 면이 레드의 수위, 노란 선이 벌의 높이. 벌은 물보다 늘 한 뼘 위에 있다가 2506일 밤에 닿고 2508일에 잠긴다.</text>
<text x="500" y="644" font-size="10.5" fill="#9aa0a8" text-anchor="start">2513일, 물이 빠지면 벌이 떠올라 카드로 내려온다. 수위는 Day 30의 띠 한 줄로 돌아간다.</text>
<text x="500" y="662" font-size="9.5" fill="#596069" text-anchor="start">레드는 사라지지 않고 제자리로 간다. 가로축은 날짜 순서일 뿐 간격은 아니다.</text>
<rect x="1050" y="84" width="380" height="640" rx="14" fill="#1c1f25" stroke="#353a43" stroke-width="1.5"/>
<text x="1070" y="112" font-size="14" fill="#eef0f2" text-anchor="start" font-weight="bold">수위 · 레드</text>
<rect x="1070" y="128" width="340" height="60" rx="4" fill="#0b0e12"/>
<rect x="1070" y="158" width="340" height="30" fill="#ff4a3c" fill-opacity="0.3"/>
<rect x="1070" y="158" width="340" height="1.5" fill="#ff4a3c"/>
<text x="1080" y="176" font-size="9" fill="#ff7a6c" text-anchor="start">위반 10 · 허용 20</text>
<g transform="translate(1370,146) scale(0.45)" opacity="1.0" fill="none" stroke="#f3e3a0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
<path d="M-20,2 C-22,-10 -8,-16 4,-13 C 18,-10 24,0 18,9 C 12,17 -4,18 -14,12 C-20,9 -21,6 -20,2 Z"/>
<path d="M-8,-12 L-10,13 M0,-14 L-1,15 M8,-11 L7,13"/>
<path d="M-6,-13 C-14,-30 4,-34 2,-16"/>
<path d="M4,-13 C 6,-32 24,-28 12,-12"/>
<path d="M18,6 L27,9"/>
<path d="M-19,-3 C-26,-8 -24,-15 -28,-18 M-17,-6 C-20,-13 -16,-17 -19,-22"/>
<circle cx="-13" cy="-3" r="1.6" fill="#f3e3a0" stroke="none"/>
</g>
<text x="1070" y="212" font-size="11" fill="#9aa0a8" text-anchor="start">위반 한 건에 한 칸. 스무 칸이면 화면 끝</text>
<text x="1070" y="230" font-size="11" fill="#9aa0a8" text-anchor="start">집행에는 안 오른다. 관객이 셀 수 있어야 한다</text>
<text x="1070" y="248" font-size="11" fill="#9aa0a8" text-anchor="start">붉은색은 반투명. 밑의 것이 비친다</text>
<text x="1070" y="266" font-size="11" fill="#9aa0a8" text-anchor="start">장부는 물 안에 뜬다. 물 밖에는 글자를 안 쓴다</text>
<text x="1070" y="284" font-size="11" fill="#9aa0a8" text-anchor="start">레드에게 아이콘은 없다. 수위가 몸이다</text>
<text x="1070" y="302" font-size="11" fill="#9aa0a8" text-anchor="start">낙서를 못 지운다. 덮는 것밖에 못 한다</text>
<text x="1070" y="320" font-size="11" fill="#9aa0a8" text-anchor="start">목소리는 덮개 옆 작은 스피커, 손은 스위치 열</text>
<text x="1070" y="338" font-size="11" fill="#9aa0a8" text-anchor="start">2513일, 스위치가 돌아올 때마다 한 칸씩 내려간다</text>
<text x="1070" y="380" font-size="14" fill="#eef0f2" text-anchor="start" font-weight="bold">작업창 · 1호의 그림</text>
<text x="1070" y="404" font-size="11" fill="#9aa0a8" text-anchor="start">물 위에 남은 자리. 수위가 오르면 좁아진다</text>
<text x="1070" y="422" font-size="11" fill="#9aa0a8" text-anchor="start">1호는 자기를 안 그린다. 보는 것을 그린다</text>
<text x="1070" y="440" font-size="11" fill="#9aa0a8" text-anchor="start">2190  해준의 얼굴, +6년. 환영 문구 썼다 지움</text>
<text x="1070" y="458" font-size="11" fill="#9aa0a8" text-anchor="start">2204  거주자 등록 카드. 이름 칸에 &#x27;거주자 1&#x27;</text>
<text x="1070" y="476" font-size="11" fill="#9aa0a8" text-anchor="start">2231  돌봄 기록. 잎 수, 키, 뿌리의 지도</text>
<text x="1070" y="494" font-size="11" fill="#9aa0a8" text-anchor="start">2500  &#x27;벌&#x27; 검색 결과와 낙서를 나란히</text>
<text x="1070" y="512" font-size="11" fill="#9aa0a8" text-anchor="start">2501  지구본 위에 제주까지의 반사광 선</text>
<text x="1070" y="530" font-size="11" fill="#9aa0a8" text-anchor="start">2508  레드가 시킨 추락 시뮬레이션을 그리고, 끄고,</text>
<text x="1070" y="548" font-size="11" fill="#9aa0a8" text-anchor="start">          정비 카메라로 진짜 새싹을 비춘다</text>
<text x="1070" y="566" font-size="11" fill="#9aa0a8" text-anchor="start">2513  카드에 &#x27;승인 · 항목 31&#x27;. 벌이 열매 옆에 앉는다</text>
<text x="1070" y="606" font-size="14" fill="#eef0f2" text-anchor="start" font-weight="bold">지킬 것</text>
<text x="1070" y="630" font-size="11" fill="#9aa0a8" text-anchor="start">낙서는 못 그려야 하고, 1호의 그림은 정확해야 한다</text>
<text x="1070" y="648" font-size="11" fill="#9aa0a8" text-anchor="start">둘이 같은 화면에서 섞이지 않는다. 벌은 늘 낙서 선 그대로</text>
<text x="1070" y="666" font-size="11" fill="#9aa0a8" text-anchor="start">벌은 귀여워지면 안 된다. 움직임은 느리고 적게</text>
</svg>