<text x="1022" y="563" fill="#9aa0a8" font-size="10.5">표시등이 덮개 빛에 묻히면 구석으로 물러난 카메라의</text>
<text x="1022" y="578" fill="#9aa0a8" font-size="10.5">흰 점검등이 1초에 한 번 깜빡인다. 맥박이 눈으로 옮겨 간다.</text>
<text x="30" y="652" fill="#9aa0a8" font-size="12">표정은 셋뿐이다. 점의 속도, 카메라의 거리, 암의 관절등. 1호는 글자로 말하지 않고 벽의 큰 스피커로 말한다.</text>
<text x="30" y="672" fill="#9aa0a8" font-size="12">그래서 레드의 붉은색이 패널을 다 덮어도 1호는 카메라 하나로 끝까지 얼굴이 있고, 2513일에 점이 다시 깜빡이면 관객은 1호가 돌아온 것을 안다.</text>
</svg>