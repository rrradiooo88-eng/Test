<text x="30" y="34" fill="#f1f1f1" font-size="20" font-weight="bold">1호의 모습 · 점 하나와 눈 하나</text>
<text x="30" y="58" fill="#9aa0a8" font-size="13">1호에게 LED 화면은 없다. 주 제어 패널의 붉은 표시등 한 점이 맥박이고, 레일 위의 정비 카메라가 눈이다. 화면의 흰 글자는 상태 기록이지 표정이 아니다.</text>
